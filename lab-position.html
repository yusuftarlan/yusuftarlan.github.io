<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Topluluk Etkinlik Kartı</title>
    <link rel="stylesheet" href="style/position.css">
</head>
<body>

    <header class="page-header">
        <h2>Kampüs Portalı</h2>
    </header>

    <main class="container">
        <div class="event-box">
            <div class="circle"></div>

            <div class="event-content">
                <p class="label">Webinar</p>
                <h1>Proses Otomasyonu ve Gelecek</h1>
                <p class="text">Endüstri 4.0 ışığında kimya tesislerinde dijital dönüşümü uzmanlarından dinleyin.</p>
                <button class="join-button">Kayıt Ol</button>
            </div>

            <div class="badge live">Canlı</div>
            <div class="badge time">Yarın 20:00</div>
            <div class="badge free">Ücretsiz</div>
        </div>
    </main>

    <div class="help-button">
        <span>💬</span>
    </div>

    <footer class="footer">
        <p>Kimya Mühendisleri Öğrenci Topluluğu &copy; 2026</p>
    </footer>

</body>
</html>
