<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Topluluk Etkinlik Kartı</title>
    <link rel="stylesheet" href="style/position.css">
</head>
<body>

    <header class="top-nav">
        <h2>Kampüs Portalı</h2>
    </header>

    <main class="container">
        <div class="event-card">
            
            <div class="decor-circle"></div>

            <div class="card-content">
                <p class="tag">Webinar</p>
                <h1>Proses Otomasyonu ve Gelecek</h1>
                <p class="desc">Endüstri 4.0 ışığında kimya tesislerinde dijital dönüşümü uzmanlarından dinleyin.</p>
                <button class="join-btn">Kayıt Ol</button>
            </div>

            <div class="badge b-1">Canlı</div>
            <div class="badge b-2">Yarın 20:00</div>
            <div class="badge b-3">Ücretsiz</div>
        </div>
    </main>

    <div class="fixed-support">
        <span>💬</span>
    </div>

    <footer class="footer">
        <p>Kimya Mühendisleri Öğrenci Topluluğu &copy; 2026</p>
    </footer>

</body>
</html>
